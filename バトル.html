  updateHealthBar(canvas, tex, viewerTeam) {

      return;
    }

    if (!c)
      return;

    ctx.clearRect(0, 0, 256, 64);
    ctx.font = 'bold 22px "Chakra Petch", sans-serif';
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(0,0,0,0.9)";
    ctx.shadowBlur = 4;
    ctx.fillStyle = this.team === "blue" ? "#38bdf8" : "#f87171";
    ctx.fillText(`[\u5473\u65B9] ${this.name}`, 128, 22);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(28, 30, 200, 14);
    const pct = Math.max(0, this.health / this.maxHealth);
    ctx.fillStyle = pct > 0.5 ? "#10b981" : pct > 0.25 ? "#f59e0b" : "#ef4444";
    ctx.fillRect(30, 32, 196 * pct, 10);

  findClosestWaypoint() {
    if (!this.waypoints.length)
      return 0;
    let closest = 0;
    let minD = Infinity;
    this.waypoints.forEach((wp, idx) => {
      const d = Math.hypot(this.position.x - wp.x, this.position.z - wp.z);
      if (d < minD) {
        minD = d;
        closest = idx;
      }
    });
    return closest;
  }
  takeDamage(amount, isHeadshot, attackerName, attackerTeam, weaponName) {
    if (this.isDead || this.invulnerableTimer > 0)
      return { killed: false, damageDealt: 0 };
    const mult = isHeadshot ? 2.5 : 1;
    let totalDmg = amount * mult;
    if (this.armor > 0) {
      const absorbed = Math.min(this.armor, totalDmg * 0.6);
      this.armor -= absorbed;
      totalDmg -= absorbed * 0.5;
    }
    this.health = Math.max(0, this.health - totalDmg);
    this.hurtFlashTimer = 0.15;
    this.updateHealthBar();
    this.reactionTimer = 0;
    if (this.health <= 0) {
      this.die(attackerName, attackerTeam, weaponName, isHeadshot);
      return { killed: true, damageDealt: totalDmg };
    }
    if (this.health < 35 && Math.random() < 0.6) {
      this.state = "TAKE_COVER";
    }
    return { killed: false, damageDealt: totalDmg };
  }
  die(_killerName, _killerTeam, _weaponName, _isHeadshot) {

  respawn(spawnPos, spawnRotY) {

    this.rotationY = spawnRotY;
    this.targetRotationY = spawnRotY;
    this.deathFallAngle = 0;
    this.group.rotation.x = 0;
    this.group.rotation.z = 0;
    this.group.position.copy(this.position);
    this.group.rotation.y = this.rotationY;
    this.invulnerableTimer = 1.8;
    this.currentWaypointIndex = this.findClosestWaypoint();
    this.state = "ROAM";

    this.currentMag = wDef.magSize;

  /**
   * Line-of-sight check against map colliders
   */
  hasLineOfSight(targetPos) {
    const from = this.position.clone().add(new THREE4.Vector3(0, 1.45, 0));
    const to = targetPos.clone();
    const dir = to.clone().sub(from);
    const dist = dir.length();
    dir.normalize();
    const ray = new THREE4.Ray(from, dir);
    for (const collider of this.colliders) {
      const hit = ray.intersectBox(collider.box, new THREE4.Vector3());
      if (hit) {
        const d = from.distanceTo(hit);
        if (d < dist - 0.5) {
          return false;
        }
      }
    }
    return true;
  }
  /**
   * Main Bot Update Tick

  update(delta, playerPos, playerTeam, playerAlive, allBots, onBotShoot) {

        this.group.rotation.x = Math.min(Math.PI / 2, this.deathFallAngle);
        this.torsoGroup.position.y = Math.max(0.15, 0.88 - this.deathFallAngle * 0.75);
      }

    }
    if (this.invulnerableTimer > 0) {
      this.invulnerableTimer -= delta;

    } else {

    }
    if (this.hurtFlashTimer > 0) {
      this.hurtFlashTimer -= delta;
    }
    let closestEnemyPos = null;
    let closestEnemyDist = Infinity;
    this.targetEnemyBot = null;
    if (playerAlive && (this.team === "ffa" || playerTeam !== this.team)) {
      const dist = this.position.distanceTo(playerPos);
      if (dist < 60) {
        const toPlayer = playerPos.clone().sub(this.position).normalize();
        const fwd = new THREE4.Vector3(0, 0, -1).applyAxisAngle(new THREE4.Vector3(0, 1, 0), this.rotationY);
        const dot = fwd.dot(toPlayer);
        if ((dot > 0.1 || dist < 8) && this.hasLineOfSight(playerPos)) {
          closestEnemyPos = playerPos;
          closestEnemyDist = dist;
        }
      }
    }
    for (const other of allBots) {
      if (other.id !== this.id && !other.isDead && (this.team === "ffa" || other.team !== this.team)) {
        const d = this.position.distanceTo(other.position);
        if (d < closestEnemyDist && d < 50) {
          if (this.hasLineOfSight(other.position)) {

    if (closestEnemyPos) {

        const toWP = new THREE4.Vector3(targetWP.x, this.position.y, targetWP.z).sub(this.position);

          } else {

          }
        } else {
          toWP.normalize();
          moveDir.copy(toWP);
          this.targetRotationY = Math.atan2(-toWP.x, -toWP.z);

      const right = new THREE4.Vector3(toEnemy.z, 0, -toEnemy.x);

      pitch: Math.round(pitch * 1e3) / 1e3,

      health,

      fy: from.y,
      fz: from.z,
      dx: dir.x,
      dy: dir.y,
      dz: dir.z

  }
  broadcastGrenade(pos, vel) {
    this.broadcast({

      y: pos.y,
      z: pos.z,
      vx: vel.x,
      vy: vel.y,
      vz: vel.z

  }
  broadcastDamage(targetId, amount, isHeadshot, weaponName) {
    this.broadcast({

      amount,
      isHeadshot,

      attackerTeam: this.localPlayerTeam,
      weaponName

  }
  broadcastKill(victimName, victimTeam, weaponName, isHeadshot) {

      victimName,
      victimTeam,
      weaponName,
      isHeadshot

  }
  broadcastPickup(pickupId) {
    this.broadcast({
      type: "pickup",
      pickupId
    });
  }
  broadcastVehicle(vehicleId, pos, rotY, speed, driverId) {
    this.broadcast({

      vehicleId,
      x: pos.x,
      y: pos.y,
      z: pos.z,
      rotY,
      speed,
      driverId

  }
  broadcast(data) {
    this.connections.forEach((conn) => {
      if (conn.open) {
        conn.send(data);
      }
    });
  }
  /**
   * Update remote players' models, animation, and smooth interpolation
   */
  update(delta) {
    this.remotePlayers.forEach((player) => {
      player.position.lerp(player.targetPos, Math.min(1, delta * 14));
      player.model.group.position.copy(player.position);
      player.model.group.rotation.y = player.yaw;
      const moveDist = player.position.distanceTo(player.targetPos);
      if (moveDist > 0.05 && !player.inVehicle) {
        const animTime = performance.now() * 8e-3;
        player.model.leftLegGroup.rotation.x = Math.sin(animTime) * 0.6;
        player.model.rightLegGroup.rotation.x = -Math.sin(animTime) * 0.6;

      }

  }
  destroy() {
    if (this.syncInterval)
      clearInterval(this.syncInterval);
    this.connections.forEach((conn) => conn.close());
    this.connections.clear();
    this.remotePlayers.forEach((p) => this.scene.remove(p.model.group));
    this.remotePlayers.clear();
    if (this.peer) {
      this.peer.destroy();
      this.peer = null;
    }
  }
};
